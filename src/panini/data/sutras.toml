# Sūtra texts (IAST) and plain-English glosses, anuvṛtti filled in.
# In glosses and notes, {modern|traditional} marks a technical term: the page shows the
# modern word with the traditional one on hover.

["1.1.3"]
text = "iko guṇavṛddhī"
gloss = "Where {full grade|guṇa} or {lengthened grade|vṛddhi} is prescribed without naming the vowel it replaces, it replaces one of {i u ṛ ḷ|ik}."

["1.1.5"]
text = "kṅiti ca"
gloss = "{Full grade|guṇa} and {lengthened grade|vṛddhi} do not replace an ik vowel before an affix marked with k or ṅ."

["1.1.45"]
text = "ig yaṇaḥ samprasāraṇam"
gloss = "{Vowel weakening|samprasāraṇa} is the replacement of a semivowel (y v r l) by its vowel (i u ṛ ḷ)."

["1.1.46"]
text = "ādyantau ṭakitau"
gloss = "An augment marked with ṭ is placed at the beginning of what it is added to; one marked with k, at the end."

["1.1.47"]
text = "mid aco 'ntyāt paraḥ"
gloss = "An augment marked with m is placed right after the last vowel of what it is added to."

["1.1.49"]
text = "ṣaṣṭhī sthāneyogā"
gloss = "A word in the genitive names what is replaced."

["1.1.50"]
text = "sthāne 'ntaratamaḥ"
gloss = "A substitute is the one closest to the original (in place, manner, and so on)."

["1.1.51"]
text = "uraṇ raparaḥ"
gloss = "A vowel that replaces ṛ or ḷ is followed by r (or l)."

["1.1.52"]
text = "alo 'ntyasya"
gloss = "A substitute replaces only the last sound of what is named."

["1.1.53"]
text = "ṅic ca"
gloss = "A substitute marked with ṅ, even one of more than one sound, replaces only the last sound."

["1.1.55"]
text = "anekālśit sarvasya"
gloss = "A substitute of more than one sound, or one marked ś, replaces the whole of what is named."

["1.1.56"]
text = "sthānivad ādeśo 'nalvidhau"
gloss = "A substitute is treated like what it replaces, except in operations conditioned by a single sound."

["1.1.60"]
text = "adarśanaṃ lopaḥ"
gloss = "Lopa means disappearance."

["1.1.64"]
text = "aco 'ntyādi ṭi"
gloss = "The last vowel and whatever follows it is called ṭi."

["1.1.65"]
text = "alo 'ntyāt pūrva upadhā"
gloss = "The sound before the last is called the {penultimate|upadhā}."

["1.1.66"]
text = "tasminn iti nirdiṣṭe pūrvasya"
gloss = "When a condition is stated in the locative, the operation applies to what immediately precedes it."

["1.1.67"]
text = "tasmād ity uttarasya"
gloss = "When a condition is stated in the ablative, the operation applies to what immediately follows it."

["1.1.69"]
text = "aṇudit savarṇasya cāpratyayaḥ"
gloss = "A vowel, semivowel or h, or a sound marked with u, also stands for the sounds of its kind (unless it is being introduced)."

["1.1.70"]
text = "taparas tatkālasya"
gloss = "A vowel followed by the marker t stands only for a vowel of that length."

["1.1.71"]
text = "ādir antyena sahetā"
gloss = "A sound together with a final marker names all the sounds from it up to that marker (abbreviations such as ac, hal)."

["1.2.1"]
text = "gāṅkuṭādibhyo 'ñṇin ṅit"
gloss = "After gāṅ, kuṭ and the like, affixes not marked ñ or ṇ count as marked ṅ."

["1.2.4"]
text = "sārvadhātukam apit"
gloss = "A {present-system affix|sārvadhātuka} without the marker p is treated as if marked with ṅ."

["1.3.1"]
text = "bhūvādayo dhātavaḥ"
gloss = "bhū ‘be’ and the others listed in the Dhātupāṭha are called {roots|dhātu}."

["1.3.2"]
text = "upadeśe 'janunāsika it"
gloss = "In a {form as taught|upadeśa}, a nasalized vowel is a {marker|it}."

["1.3.3"]
text = "hal antyam"
gloss = "In a form as taught, a final consonant is a {marker|it}."

["1.3.4"]
text = "na vibhaktau tusmāḥ"
gloss = "But in an {inflectional ending|vibhakti}, a final t, th, d, dh, n, s or m is not a marker."

["1.3.5"]
text = "ādir ñiṭuḍavaḥ"
gloss = "In a root as taught, an initial ñi, ṭu or ḍu is a {marker|it}."

["1.3.6"]
text = "ṣaḥ pratyayasya"
gloss = "An initial ṣ of an {affix|pratyaya} is a {marker|it}."

["1.3.7"]
text = "cuṭū"
gloss = "In an affix as taught, an initial palatal or retroflex stop is a {marker|it}."

["1.3.8"]
text = "laśakvataddhite"
gloss = "In an affix other than a {secondary nominal suffix|taddhita}, an initial l, ś or velar stop is a {marker|it}."

["1.3.9"]
text = "tasya lopaḥ"
gloss = "A {marker|it} is deleted."

["1.3.10"]
text = "yathāsaṅkhyam anudeśaḥ samānām"
gloss = "When equal numbers of items are paired, they correspond in order."

["1.3.12"]
text = "anudāttaṅita ātmanepadam"
gloss = "After a root whose marker vowel is {unaccented|anudātta}, or which has the marker ṅ, the {middle|ātmanepada} endings are used."

["1.3.60"]
text = "śadeḥ śitaḥ"
gloss = "After śad, the {middle|ātmanepada} endings are used when an affix marked ś follows."

["1.3.72"]
text = "svaritañitaḥ kartrabhiprāye kriyāphale"
gloss = "After a root whose marker vowel is {falling-pitched|svarita}, or which has the marker ñ, the {middle|ātmanepada} endings are used when the fruit of the action goes to the agent."

["1.3.78"]
text = "śeṣāt kartari parasmaipadam"
gloss = "After all other roots, the {active|parasmaipada} endings are used to denote the agent."

["1.4.2"]
text = "vipratiṣedhe paraṃ kāryam"
gloss = "In a conflict between two rules of equal force, the later one takes effect (Kiparsky: only within the section where each item gets a single technical name, 1.4.1–2.2.38)."

["1.4.10"]
text = "hrasvaṃ laghu"
gloss = "A short vowel is called {light|laghu}."

["1.4.13"]
text = "yasmāt pratyayavidhis tadādi pratyaye 'ṅgam"
gloss = "Whatever an affix is added after, from its beginning on, is called the {base|aṅga} of that affix."

["1.4.14"]
text = "suptiṅantaṃ padam"
gloss = "What ends in a {case ending|sup} or a {personal ending|tiṅ} is called a {word|pada}."

["1.4.21"]
text = "bahuṣu bahuvacanam"
gloss = "The {plural|bahuvacana} is used for many."

["1.4.22"]
text = "dvyekayor dvivacanaikavacane"
gloss = "The {dual|dvivacana} and {singular|ekavacana} are used for two and one."

["1.4.99"]
text = "laḥ parasmaipadam"
gloss = "The substitutes of l are called {active endings|parasmaipada}."

["1.4.100"]
text = "taṅānāv ātmanepadam"
gloss = "The endings ta … mahiṅ (taṅ) and the participle suffixes in -āna are called {middle|ātmanepada}."

["1.4.101"]
text = "tiṅas trīṇi trīṇi prathamamadhyamottamāḥ"
gloss = "The {personal endings|tiṅ}, in groups of three, are called {third, second and first person|prathama, madhyama, uttama}."

["1.4.102"]
text = "tāny ekavacanadvivacanabahuvacanāny ekaśaḥ"
gloss = "Within each group of three, the members are called {singular, dual and plural|ekavacana, dvivacana, bahuvacana}."

["1.4.104"]
text = "vibhaktiś ca"
gloss = "Those groups of three (of case and verb endings) are also called {inflectional endings|vibhakti}."

["1.4.105"]
text = "yuṣmady upapade samānādhikaraṇe sthāniny api madhyamaḥ"
gloss = "The {second person|madhyama} is used when the agent is the addressee (yuṣmad ‘you’), whether or not the pronoun is spoken."

["1.4.107"]
text = "asmady uttamaḥ"
gloss = "The {first person|uttama} is used when the agent is the speaker (asmad ‘I’)."

["1.4.108"]
text = "śeṣe prathamaḥ"
gloss = "The {third person|prathama} is used in the remaining cases."

["3.1.1"]
text = "pratyayaḥ"
gloss = "(Heading over books 3–5) What is introduced from here on is an {affix|pratyaya}."

["3.1.2"]
text = "paraś ca"
gloss = "(Heading) And it is placed after what it is added to."

["3.1.67"]
text = "sārvadhātuke yak"
gloss = "Before a {present-system affix|sārvadhātuka} in the passive or impersonal, the {stem suffix|vikaraṇa} yak is added."

["3.1.68"]
text = "kartari śap"
gloss = "When a {present-system affix|sārvadhātuka} denoting the agent follows, the {stem suffix|vikaraṇa} śap is added to the root (as an affix, 3.1.1, placed after it, 3.1.2, after a root, 3.1.91)."

["3.1.77"]
text = "tudādibhyaḥ śaḥ"
gloss = "After the roots of the tud class the {stem suffix|vikaraṇa} śa is added instead of śap (3.1.68), before a {present-system affix|sārvadhātuka} denoting the agent."

["3.1.91"]
text = "dhātoḥ"
gloss = "(Heading over the rest of book 3) The affixes introduced from here on are added after a root."

["3.2.111"]
text = "anadyatane laṅ"
gloss = "To denote past time not of today, laṅ is added to a root (as an affix, 3.1.1, placed after it, 3.1.2, after a root, 3.1.91)."

["3.2.123"]
text = "vartamāne laṭ"
gloss = "To denote present (ongoing) time, laṭ is added to a root (as an affix, 3.1.1, placed after it, 3.1.2, after a root, 3.1.91)."

["3.4.77"]
text = "lasya"
gloss = "(Heading) In place of l, the general tense/mood affix:"

["3.4.78"]
text = "tiptasjhisipthasthamibvasmastātāṃjhathāsāthāṃdhvamiḍvahimahiṅ"
gloss = "l is replaced by one of the eighteen person/number endings: tip tas jhi, sip thas tha, mip vas mas ({active|parasmaipada}); ta ātām jha, thās āthām dhvam, iṭ vahi mahiṅ ({middle|ātmanepada})."

["3.4.79"]
text = "ṭita ātmanepadānāṃ ṭer e"
gloss = "In place of a lakāra marked with ṭ (e.g. laṭ), the ṭi of a {middle|ātmanepada} ending is replaced by e."

["3.4.80"]
text = "thāsaḥ se"
gloss = "In place of a lakāra marked with ṭ, the ending thās is replaced by se."

["3.4.99"]
text = "nityaṃ ṅitaḥ"
gloss = "In place of a lakāra marked with ṅ (e.g. laṅ), the final s of a first-person ending is always dropped."

["3.4.100"]
text = "itaś ca"
gloss = "In place of a lakāra marked with ṅ, the final i of an {active|parasmaipada} ending is also dropped."

["3.4.101"]
text = "tasthasthamipāṃ tāṃtaṃtāmaḥ"
gloss = "In place of a lakāra marked with ṅ, tas, thas, tha and mip are replaced by tām, tam, ta and am."

["3.4.113"]
text = "tiṅśit sārvadhātukam"
gloss = "A {personal ending|tiṅ}, or an affix marked with ś, is called a {present-system affix|sārvadhātuka}."

["6.1.15"]
text = "vacisvapiyajādīnāṃ kiti"
gloss = "Before an affix marked k, vac, svap and the roots of the yaj group weaken a semivowel to its vowel ({vowel weakening|samprasāraṇa})."

["6.1.16"]
text = "grahijyāvayivyadhivaṣṭivicativṛścatipṛcchatibhṛjjatīnāṃ ṅiti ca"
gloss = "Before an affix marked k or ṅ, grah, jyā, vay, vyadh, vaś, vyac, vrasc, prach and bhrasj weaken a semivowel to its vowel ({vowel weakening|samprasāraṇa})."

["6.1.64"]
text = "dhātvādeḥ ṣaḥ saḥ"
gloss = "A root-initial ṣ is replaced by s (and the retroflex sound it had caused goes back to dental)."

["6.1.64.1"]
text = "subdhātu-ṣṭhivu-ṣvaṣkatīnāṃ pratiṣedhaḥ"
gloss = "(Vārttika on 6.1.64) The roots ṣṭhiv and ṣvaṣk keep their ṣ: it is not replaced by s."

["6.1.65"]
text = "ṇo naḥ"
gloss = "A root-initial ṇ is replaced by n."

["6.1.66"]
text = "lopo vyor vali"
gloss = "y and v are deleted before any consonant other than y ({val|val})."

["6.1.71"]
text = "hrasvasya piti kṛti tuk"
gloss = "A short vowel gets the augment tuk before a p-marked primary suffix."

["6.1.72"]
text = "saṃhitāyām"
gloss = "(Heading) In close contact: the following apply to sounds pronounced together."

["6.1.73"]
text = "che ca"
gloss = "Before ch, a short vowel gets the augment tuk (t)."

["6.1.75"]
text = "dīrghāt"
gloss = "Before ch, a long vowel gets the augment tuk (t)."

["6.1.77"]
text = "iko yaṇ aci"
gloss = "Before a vowel, i u ṛ ḷ are replaced by y v r l."

["6.1.78"]
text = "eco 'yavāyāvaḥ"
gloss = "Before a vowel, e, o, ai, au are replaced by ay, av, āy, āv."

["6.1.84"]
text = "ekaḥ pūrvaparayoḥ"
gloss = "(Heading) A single substitute replaces both the preceding and the following sound:"

["6.1.85"]
text = "antādivac ca"
gloss = "That single substitute counts as the end of what precedes and the beginning of what follows."

["6.1.86"]
text = "ṣatvatukor asiddhaḥ"
gloss = "The single-substitute rules that follow (to 6.1.110) are treated as not having taken effect when ṣ-substitution or the augment tuk applies."

["6.1.87"]
text = "ād guṇaḥ"
gloss = "a or ā and a following vowel are together replaced by {full grade|guṇa} (a, e, o, ar, al)."

["6.1.88"]
text = "vṛddhir eci"
gloss = "a or ā and a following e, o, ai, au are together replaced by {lengthened grade|vṛddhi} (ā, ai, au)."

["6.1.90"]
text = "āṭaś ca"
gloss = "The augment āṭ and a following vowel are together replaced by {lengthened grade|vṛddhi}."

["6.1.94"]
text = "eṅi pararūpam"
gloss = "The a of a preverb and a following e or o of a root are together replaced by the second."

["6.1.96"]
text = "usy apadāntāt"
gloss = "An a not at the end of a word and the ending us are together replaced by the second."

["6.1.97"]
text = "ato guṇe"
gloss = "Short a (not at the end of a word) and a following {full-grade|guṇa} vowel (a, e, o) are together replaced by the second."

["6.1.101"]
text = "akaḥ savarṇe dīrghaḥ"
gloss = "A vowel a, i, u, ṛ, ḷ and a following vowel of the same kind are together replaced by the long vowel."

["6.1.108"]
text = "samprasāraṇāc ca"
gloss = "After a {vowel-weakening|samprasāraṇa} vowel, a following vowel and it are replaced by the first of the two."

["6.4.1"]
text = "aṅgasya"
gloss = "(Heading over 6.4.1–7.4.97) The following operations apply to a {base|aṅga}."

["6.4.22"]
text = "asiddhavad atrābhāt"
gloss = "From here to 6.4.175 (the {ābhīya|ābhīya} section), a rule is treated as not having taken effect when another rule of the section applies in the same environment."

["6.4.23"]
text = "śnān nalopaḥ"
gloss = "After the stem suffix śna (the na of the seventh class), n is dropped."

["6.4.24"]
text = "aniditāṃ hala upadhāyāḥ kṅiti"
gloss = "Before an affix marked with k or ṅ, the penultimate nasal of a root ending in a consonant is dropped, unless the root is marked with i."
# Traced since slice 1.6: in laṭ and laṅ only śa (tudādi, 3.1.77) counts as marked ṅ; śap is
# marked p, so bhvādi roots never meet 6.4.24 there.

["6.4.25"]
text = "daṃśasañjasvañjāṃ śapi"
gloss = "Before śap, daṃś, sañj and svañj lose their penultimate nasal."

["6.4.26"]
text = "rañjeś ca"
gloss = "Before śap, rañj also loses its penultimate nasal."

["6.4.71"]
text = "luṅlaṅlṛṅkṣv aḍ udāttaḥ"
gloss = "Before luṅ, laṅ and lṛṅ, the base gets the (accented) augment aṭ."

["6.4.72"]
text = "āḍ ajādīnām"
gloss = "A base beginning with a vowel gets the augment āṭ instead."

["6.4.77"]
text = "aci śnudhātubhruvāṃ yvor iyaṅuvaṅau"
gloss = "Before a vowel, the i/u of śnu, of a root and of bhrū is replaced by iy/uv."

["6.4.89"]
text = "ūd upadhāyā gohaḥ"
gloss = "Before an affix beginning with a vowel, the penultimate vowel of goh (guh in its {full grade|guṇa}) is replaced by ū."

["7.1.2"]
text = "āyaneyīnīyiyaḥ phaḍhakhachaghāṃ pratyayādīnām"
gloss = "At the start of an affix, ph ḍh kh ch gh are replaced by āyan, ey, īn, īy, iy."

["7.1.3"]
text = "jho 'ntaḥ"
gloss = "The jh of an affix is replaced by ant."

["7.1.5"]
text = "ātmanepadeṣv anataḥ"
gloss = "In a {middle|ātmanepada} ending, jh is replaced by at after a base that does not end in short a."

["7.1.58"]
text = "idito num dhātoḥ"
gloss = "A root marked with i gets the augment num (n)."

["7.1.59"]
text = "śe mucādīnām"
gloss = "Before śa, the roots of the muc group get the {augment|āgama} n (num)."

["7.1.59.1"]
text = "śe tṛmphādīnāṃ num vācyaḥ"
gloss = "(Vārttika on 7.1.59) The roots of the tṛmph group also get num before śa."

["7.1.61"]
text = "radhijabhor aci"
gloss = "Before an affix beginning with a vowel, radh and jabh get the augment num (n)."

["7.1.100"]
text = "ṝta id dhātoḥ"
gloss = "A root's final ṝ is replaced by i (followed by r, 1.1.51)."

["7.2.80"]
text = "ato yeyaḥ"
gloss = "After a base in a, the yā of the optative is replaced by iy."

["7.2.81"]
text = "āto ṅitaḥ"
gloss = "After a base ending in a, the ā of an ending marked with ṅ (or treated as such) is replaced by iy."

["7.3.74"]
text = "śamām aṣṭānāṃ dīrghaḥ śyani"
gloss = "Before the {stem suffix|vikaraṇa} śyan, the vowel of the eight roots beginning with śam is lengthened."

["7.3.75"]
text = "ṣṭhivuklamyācamāṃ śiti"
gloss = "Before an affix marked ś, the vowel of ṣṭhiv, klam and ā-cam is lengthened."

["7.3.77"]
text = "iṣugamiyamāṃ chaḥ"
gloss = "Before an affix marked with ś, the final of iṣ, gam and yam is replaced by ch."

["7.3.78"]
text = "pāghrādhmāsthāmnādāṇdṛśyartisartiśadasadāṃ pibajighradhamatiṣṭhamanayacchapaśyarcchadhauśīyasīdāḥ"
gloss = "Before an affix marked ś, pā, ghrā, dhmā, sthā, mnā, dāṇ, dṛś, ṛ, sṛ, śad and sad are replaced by piba, jighra, dhama, tiṣṭha, mana, yaccha, paśya, ṛccha, dhau, śīya and sīda."

["7.3.82"]
text = "mider guṇaḥ"
gloss = "Before an affix marked ś, the vowel of mid takes {full grade|guṇa}."

["7.3.84"]
text = "sārvadhātukārdhadhātukayoḥ"
gloss = "Before a {present-system|sārvadhātuka} or {non-present|ārdhadhātuka} affix, a final {i u ṛ ḷ|ik} of the {base|aṅga} takes {full grade|guṇa}."

["7.3.86"]
text = "pugantalaghūpadhasya ca"
gloss = "Before a {present-system|sārvadhātuka} or {non-present|ārdhadhātuka} affix, a light penultimate {i u ṛ ḷ|ik} of the {base|aṅga} also takes {full grade|guṇa}."

["7.3.101"]
text = "ato dīrgho yañi"
gloss = "Before a {present-system affix|sārvadhātuka} beginning with one of {resonants, jh, and bh|yañ}, a base-final short a is lengthened."

["7.4.27"]
text = "rīṅ ṛtaḥ"
gloss = "Before yak and a {suffix|pratyaya} beginning with y that is neither a kṛt suffix nor a {present-system affix|sārvadhātuka} (akṛtsārvadhātukayoḥ, from 7.4.25), a base-final ṛ is replaced by rī (rīṅ)."

["7.4.28"]
text = "riṅ śayagliṅkṣu"
gloss = "Before śa, yak and the benedictive liṅ, a root's final ṛ is replaced by ri (riṅ)."

["8.1.16"]
text = "padasya"
gloss = "(Heading to 8.3.55) The following apply to a {word|pada}."

["8.2.1"]
text = "pūrvatrāsiddham"
gloss = "(Heading) From here to the end of the grammar, each rule is treated as not having taken effect (asiddha) with respect to every earlier rule."

["8.2.18"]
text = "kṛpo ro laḥ"
gloss = "In the root kṛp, r (also the r heard in ṛ) is replaced by l."

["8.2.20"]
text = "gro yaṅi"
gloss = "Before the intensive suffix yaṅ, the r of gṝ becomes l."

["8.2.21"]
text = "aci vibhāṣā"
gloss = "Before a vowel, the r of gṝ preferably does not become l (it may)."

["8.2.23"]
text = "saṃyogāntasya lopaḥ"
gloss = "The final consonant of a word ending in a consonant cluster is deleted."

["8.2.39"]
text = "jhalāṃ jaśo 'nte"
gloss = "At the end of a word, an {obstruent|jhal} is replaced by the {voiced unaspirated stop|jaś} of its class."

["8.2.66"]
text = "sasajuṣo ruḥ"
gloss = "At the end of a word, s (and the final of sajuṣ) is replaced by ru."

["8.2.76"]
text = "rvor upadhāyā dīrgha ikaḥ"
gloss = "(Heading) The {simple vowel|ik} (i, u, ṛ, ḷ) that stands in the {penultimate position|upadhā} of a root ending in r or v is lengthened."

["8.2.77"]
text = "hali ca"
gloss = "Also before a consonant (hal)."

["8.2.78"]
text = "upadhāyāṃ ca"
gloss = "Also when the r or v itself stands in the {penultimate position|upadhā}: the {simple vowel|ik} before it is lengthened."

["8.2.79"]
text = "na bhakurchurām"
gloss = "Not for the roots bha, kur and chur."

["8.3.15"]
text = "kharavasānayor visarjanīyaḥ"
gloss = "Before a {voiceless consonant|khar} or at a pause, r at the end of a word becomes {final h|visarga} (ḥ)."

["8.3.24"]
text = "naś cāpadāntasya jhali"
gloss = "Before an obstruent, n or m not at the end of a word becomes {nasal glide|anusvāra} (ṃ)."

["8.4.1"]
text = "raṣābhyāṃ no ṇaḥ samānapade"
gloss = "In the same word, n right after r or ṣ becomes ṇ."

["8.4.1.1"]
text = "ṛvarṇāc ceti vaktavyam"
gloss = "(Vārttika on 8.4.1) ṛ and ṝ count like r: n after them, in the same word, becomes ṇ."

["8.4.2"]
text = "aṭkupvāṅnumvyavāye 'pi"
gloss = "n becomes ṇ after r or ṣ even when a vowel, h, y, v, r, a velar or labial stop, the preverb ā (āṅ), or the augment n (num) comes between."

["8.4.37"]
text = "padāntasya"
gloss = "(Prohibition) A word-final n is not replaced by ṇ."

["8.4.40"]
text = "stoḥ ścunā ścuḥ"
gloss = "s and the dentals (t th d dh n), next to ś or a palatal, become ś and the corresponding palatals."

["8.4.41"]
text = "ṣṭunā ṣṭuḥ"
gloss = "s and the dentals (t th d dh n), next to ṣ or a retroflex stop, become ṣ and the corresponding retroflexes."

["8.4.53"]
text = "jhalāṃ jaś jhaśi"
gloss = "An obstruent (jhal) before a voiced stop (jhaś) becomes the voiced unaspirated stop (jaś) of its own place."

["8.4.55"]
text = "khari ca"
gloss = "Before a {voiceless consonant|khar}, an {obstruent|jhal} also becomes the {voiceless unaspirated stop|car}."

["8.4.56"]
text = "vāvasāne"
gloss = "At a pause, an obstruent is {preferably|vā} replaced by the {voiceless unaspirated stop|car}."

["8.4.58"]
text = "anusvārasya yayi parasavarṇaḥ"
gloss = "Before a consonant other than a sibilant or h ({yay|yay}), {the nasal glide|anusvāra} is replaced by a sound of the same class as the following one."

