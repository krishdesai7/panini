[articles."1.1.1"]
kind = "definition"
explanation = """
In [[ādaic]], [[āt]] gives long [[ā]], and the rest of the word names the
{long diphthongs|aic}, [[ai]] and [[au]]. The [[Kāśikā]] explains that the marker
[[t]] fixes the length of the diphthongs here. Other rules prescribe when to use
a vowel of this grade.
"""
citations = [
  { source = "astadhyayi", role = "text", locator = "1.1.1" },
  { source = "kashika", role = "commentary", locator = "on 1.1.1" },
]

[articles."1.1.1".related]
"1.1.3" = "Which vowel is replaced when a rule prescribes {lengthened grade|vṛddhi} without naming the original."
"1.1.70" = "How a following [[t]] fixes vowel length."
"1.1.71" = "How the {sound-class abbreviation|pratyāhāra} for the {long diphthongs|aic} is formed."
"6.1.90" = "Prescribes {lengthened grade|vṛddhi} after the augment [[āṭ]]."

[[articles."1.1.1".examples]]
request = { root = "01.1086", tense = "laṅ", person = 3, number = "sg", voice = "active" }
step_rule = "6.1.90"
note = "In [[ārcchat]], 6.1.90 combines the augment [[ā]] and the root vowel [[ṛ]]. The [[ā]] of [[ār]] is the {lengthened-grade|vṛddhi} vowel. The [[r]] is supplied by 1.1.51."

[articles."1.1.2"]
kind = "definition"
explanation = """
In [[adeṅ]], [[at]] gives short [[a]], and the rest of the word names the
{short diphthongs|eṅ}, [[e]] and [[o]]. Other rules prescribe when to use a vowel
