[articles."6.1.90"]
kind = "operation"
explanation = """
{Lengthened grade|vṛddhi} carries over from 6.1.88. When the vowel left by
the augment [[āṭ]] meets the next vowel, a single vowel of that grade takes
the place of both (6.1.84).
"""
citations = [{ source = "astadhyayi", role = "text", locator = "6.1.84, 6.1.88, 6.1.90" }]

[articles."6.1.90".related]
"1.1.1" = "Defines {lengthened grade|vṛddhi}."
"1.1.51" = "Accounts for the [[r]] in the substitute [[ār]]."
"6.4.72" = "Supplies the augment [[āṭ]] before a vowel."

[[articles."6.1.90".examples]]
request = { root = "01.1086", tense = "laṅ", person = 3, number = "sg", voice = "active" }
note = "The past imperfective of [[ṛ]] receives [[āṭ]]. The augment vowel [[ā]] and the root vowel [[ṛ]] merge into [[ār]] on the way to [[ārcchat]]."

[articles."7.3.84"]
kind = "operation"
explanation = """
The rule names two classes of following affix, {present-system|sārvadhātuka}
and {non-present|ārdhadhātuka}. The operation is {full grade|guṇa}, carried
over from 7.3.82. It applies to a final
{close syllabic|ik} ([[i]], [[u]], [[ṛ]], or [[ḷ]], including their long counterparts) of the
{base|aṅga}. Rule 1.1.5 blocks the change before an affix marked [[k]] or [[ṅ]].

Kiparsky points out how the marker [[p]] on [[śap]] makes {full grade|guṇa} possible in [[bhavati]].
Without [[p]], 1.2.4 would treat this affix as [[ṅ]]-marked, and 1.1.5 would block
the change from [[ū]] to [[o]] [@kiparsky_architecture].
"""
scope = "This rule is implemented for {present-system affixes|sārvadhātuka} in {present imperfective|laṭ} and {past imperfective|laṅ} derivations."
citations = [
  { source = "astadhyayi", role = "text", locator = "7.3.82–84" },
  { source = "kashika", role = "commentary", locator = "on 1.1.3 and 7.3.84" },
  { source = "kiparsky_architecture", role = "analysis", locator = "§3.4.1, discussion after (127)", label = "Kiparsky, §3.4.1" },
]

[articles."7.3.84".related]
"1.1.2" = "Defines {full grade|guṇa}."
"1.1.3" = "Identifies the {close syllabics|ik} as the targets of full grade."
"1.1.5" = "Blocks {full grade|guṇa} before an affix marked [[k]] or [[ṅ]]."
"1.2.4" = "Treats a {present-system|sārvadhātuka} affix without [[p]] as [[ṅ]]-marked."
"7.3.86" = "Extends {full grade|guṇa} to a base with a light penultimate vowel."

[[articles."7.3.84".examples]]
request = { root = "01.0001", tense = "laṭ", person = 3, number = "sg", voice = "active" }
note = "The final [[ū]] of [[bhū]] takes {full grade|guṇa} before the thematic suffix [[śap]]. After the markers of [[śap]] are removed, that suffix appears as [[a]]."
