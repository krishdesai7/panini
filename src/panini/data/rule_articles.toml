[articles."1.1.1"]
kind = "definition"
explanation = """
Read ādaic as āt + aic. Here āt gives long ā, and aic is the
{sound abbreviation|pratyāhāra} for ai and au. The Kāśikā explains the
marker t as fixing the length of ai and au here. Each of the three vowels
is called vṛddhi. Other sūtras prescribe when to use a vowel of this grade.
"""
citations = [
  { source = "astadhyayi", role = "text", locator = "1.1.1" },
  { source = "kashika", role = "commentary", locator = "on 1.1.1" },
]

[articles."1.1.1".related]
"1.1.3" = "Which vowel is replaced when a rule prescribes vṛddhi without naming the original."
"1.1.70" = "How a following t fixes vowel length."
"1.1.71" = "How abbreviations such as aic are formed."
"6.1.90" = "Prescribes vṛddhi after the augment āṭ."

[[articles."1.1.1".examples]]
request = { root = "01.1086", tense = "laṅ", person = 3, number = "sg", voice = "active" }
step_rule = "6.1.90"
note = "In ārcchat, 6.1.90 combines the augment ā and the root vowel ṛ. The ā of ār is the vṛddhi vowel. The r is supplied by 1.1.51."

[articles."1.1.2"]
kind = "definition"
explanation = """
Read adeṅ as at + eṅ. Here at gives short a, and eṅ is the
{sound abbreviation|pratyāhāra} for e and o. Each of the three vowels
is called guṇa. Other sūtras prescribe when to use a vowel of this grade.
"""
citations = [
  { source = "astadhyayi", role = "text", locator = "1.1.2" },
  { source = "kashika", role = "commentary", locator = "on 1.1.2" },
]

