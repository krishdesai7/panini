[articles."6.1.90"]
kind = "operation"
explanation = """
Vṛddhi carries over from 6.1.88. When the vowel left by the augment āṭ
meets the next vowel, a single substitute of vṛddhi grade takes the place
of both (6.1.84).
"""
citations = [{ source = "astadhyayi", role = "text", locator = "6.1.84, 6.1.88, 6.1.90" }]

[articles."6.1.90".related]
"1.1.1" = "Defines vṛddhi."
"1.1.51" = "Accounts for the r in the substitute ār."
"6.4.72" = "Supplies the augment āṭ before a vowel."

[[articles."6.1.90".examples]]
request = { root = "01.1086", tense = "laṅ", person = 3, number = "sg", voice = "active" }
note = "The imperfect of ṛ receives āṭ. The augment vowel ā and the root vowel ṛ merge into ār on the way to ārcchat."

[articles."7.3.84"]
kind = "operation"
explanation = """
The sūtra names the two classes of following affix, sārvadhātuka and
ārdhadhātuka.
The operation is guṇa, carried over from 7.3.82. It applies to a final
{i, u, ṛ, or ḷ (including long counterparts)|ik} vowel of the
{base|aṅga}. Rule 1.1.5 blocks the change before an affix marked k or ṅ.

Kiparsky points out how the marker p on śap makes guṇa possible in bhavati.
Without p, 1.2.4 would treat this affix as ṅ-marked, and 1.1.5 would block
the change from ū to o.
"""
scope = "The explorer currently implements the sārvadhātuka branch for its laṭ and laṅ derivations."
citations = [
  { source = "astadhyayi", role = "text", locator = "7.3.82–84" },
  { source = "kashika", role = "commentary", locator = "on 1.1.3 and 7.3.84" },
  { source = "kiparsky_architecture", role = "analysis", locator = "§3.4.1, discussion after (127)" },
]

[articles."7.3.84".related]
"1.1.2" = "Defines guṇa."
"1.1.3" = "Supplies the ik restriction."
"1.1.5" = "Blocks guṇa before an affix marked k or ṅ."
"1.2.4" = "Treats a sārvadhātuka affix without p as ṅ-marked."
"7.3.86" = "Extends guṇa to a base with a light penultimate vowel."

